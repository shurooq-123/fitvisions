name: fitvisions
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11

  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
  firebase_storage: 12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: TimesNewRoman
      fonts:
        - asset: assets/fonts/times.ttf
        - asset: assets/fonts/timesbd.ttf
          weight: 700

  assets:
    - images/
